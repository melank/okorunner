[package]
name = "okorunner"
version = "0.1.0"
description = "やる気起こrunner"
authors = ["melank"]
edition = "2021"

[lib]
name = "okorunner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
